name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check index.mjs
          node --check lib/config.mjs
          node --check lib/util.mjs
          node --check lib/store.mjs
          node --check lib/inject.mjs
          node --check lib/core.mjs
          node --check lib/dream.mjs
          node --check lib/panel.mjs
          node --check lib/tools.mjs
          node --check lib/lock.mjs
          node --check lib/log.mjs
          node --check client/client.js
      - name: Smoke tests
        run: npm test
